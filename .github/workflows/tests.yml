name: Tests and package
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.9.7
      - run: uv sync --locked --extra dev --python python
      - run: uv pip list --python .venv/bin/python
      - run: .venv/bin/python -m ruff check lib helpers orfbounder.py orfbounder_batch.py tests
      - run: .venv/bin/python -m pytest -q -W error
      - run: .venv/bin/python -m build
      - run: uv pip install --python .venv/bin/python --reinstall --no-deps dist/orfbounder-*.whl
      - run: '"${{ github.workspace }}/.venv/bin/orfbounder" --help && "${{ github.workspace }}/.venv/bin/orfbounder-batch" --help'
        working-directory: /tmp
  latest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install '.[dev]'
      - run: python -m pip list
      - run: python -m pytest -q -W error
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag orfbounder:test .
      - run: docker run --rm orfbounder:test orfbounder --help
      - run: docker run --rm orfbounder:test orfbounder-batch --help
